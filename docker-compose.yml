# 熱血物語：見家長 — the whole deployment.
#
# ONE CONTAINER. NEVER SCALE THIS.
#
# The store is SQLite on a local file. Two containers would each open their own
# copy of it — or worse, both write the same file over a shared mount, which
# corrupts it. `deploy.replicas` is not commented out here because there is
# nothing to tune: replication is simply wrong for this design. If it ever needs
# to scale, the database has to move to something that accepts more than one
# writer first, and that is a different project.

services:
  game:
    build: .
    image: passionatestory:latest
    container_name: passionatestory
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Must point INSIDE the mount below. A path anywhere else is inside the
      # image, and every redeploy silently wipes every record.
      DB_PATH: /data/records.db
      PORT: "8080"
      NODE_ENV: production

      # Signing key for run submissions. Put RUN_KEY in a .env file beside this
      # one to override it; unset, it falls back to the same development default
      # the code uses, so behaviour does not change silently.
      #
      # Changing it raises the effort to forge a score. It does not prevent one:
      # the client has to sign its own submission, so this key necessarily ships
      # to the browser. See the README's integrity note.
      RUN_KEY: ${RUN_KEY:-passionatestory-client-key}

    volumes:
      # C3: records survive `docker compose down && up`. This line is the reason
      # they do. A named volume rather than a bind mount so it is not tied to a
      # host path, and it outlives the container by design.
      - records:/data

    healthcheck:
      # NOTE: /healthz returns a static {status:"ok"} and does NOT read the
      # database, so a pass means the process is up and serving — not that the
      # store is usable. A corrupt or unwritable DB would still report healthy.
      # Check the leaderboard endpoint if you need the store proved.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # SQLite in WAL mode is happy on very little; the cap is here so a runaway
    # cannot take the host down with it.
    mem_limit: 512m

volumes:
  records:
    # `docker compose down` removes containers and networks but NOT named
    # volumes, which is exactly the property C3 depends on. Only
    # `down -v` destroys this, and that is the command to be careful with.
    name: passionatestory_records
